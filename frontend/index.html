<!DOCTYPE html>
<html>
<head>
<title>Smart Job Recommendation Portal</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.container{
width:60%;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#007BFF;
color:white;
font-weight:bold;
cursor:pointer;
}

.job-card{
background:#f9f9f9;
padding:15px;
margin-top:15px;
border-radius:8px;
border-left:5px solid #007BFF;
}

.error{
color:red;
margin-top:10px;
}

.loading{
color:green;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>Smart Job Recommendation Portal</h1>

<label>Skills</label>
<input id="skills" placeholder="Python, Machine Learning">

<label>Location (optional)</label>
<input id="location" placeholder="US, UK">

<label>Experience (years)</label>
<input id="experience" placeholder="0,1,3,5">

<button onclick="getRecommendations()">Get Recommendations</button>

<div id="message"></div>
<div id="results"></div>

</div>

<script>

async function getRecommendations(){

const skills=document.getElementById("skills").value
const location=document.getElementById("location").value
const experience=document.getElementById("experience").value

const message=document.getElementById("message")
const results=document.getElementById("results")

results.innerHTML=""
message.innerHTML=""

if(!skills.trim()){
message.innerHTML="<div class='error'>Please enter skills</div>"
return
}

message.innerHTML="<div class='loading'>Loading...</div>"

try{

const response=await fetch("http://127.0.0.1:5000/recommend",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

skills:skills,
location:location,
experience:experience

})

})

const data=await response.json()

message.innerHTML=""

if(data.error){

message.innerHTML="<div class='error'>"+data.error+"</div>"
return

}

if(data.length==0){

results.innerHTML="<div class='error'>No jobs found</div>"
return

}

data.forEach(job=>{

results.innerHTML+=`

<div class="job-card">

<h3>${job.title}</h3>

<p><strong>Location:</strong> ${job.location}</p>

<p><strong>Industry:</strong> ${job.industry}</p>

<p><strong>Experience:</strong> ${job.required_experience}</p>



</div>

`

})

}

catch(error){

message.innerHTML="<div class='error'>Backend connection failed</div>"

}

}

</script>

</body>
</html>
